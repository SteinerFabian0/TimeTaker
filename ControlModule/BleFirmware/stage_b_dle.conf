# Stage B2: data length extension, 251 B link-layer packets (guide §6.3, §9).
# Without it a 244 B notification goes out as 27 B LL fragments.
CONFIG_BT_DATA_LEN_UPDATE=y
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
# The peripheral starts the procedure itself (USER_DATA_LEN_UPDATE would
# otherwise turn the automatic one off).
CONFIG_BT_AUTO_DATA_LEN_UPDATE=y

#
# Debug build: logging over SEGGER RTT (SWD), never in a release image.
#   BUILD=build-debug tools/build.sh -- -DEXTRA_CONF_FILE=debug.conf
# Read it with OpenOCD's RTT server (BENCH_TESTS.md T0.4). UARTE0 is the STM
# link, so RTT is the only console (guide §10).
#
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_USE_SEGGER_RTT=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=256
CONFIG_SEGGER_RTT_BUFFER_SIZE_DOWN=16
CONFIG_SEGGER_RTT_MAX_NUM_UP_BUFFERS=1
CONFIG_SEGGER_RTT_MAX_NUM_DOWN_BUFFERS=1

# Stack sizing (guide §9 step 1): the thread analyzer prints every thread's
# stack use over RTT every 30 s.
CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=30
CONFIG_THREAD_ANALYZER_USE_LOG=y
CONFIG_THREAD_ANALYZER_ISR_STACK_USAGE=y
CONFIG_THREAD_ANALYZER_AUTO_STACK_SIZE=768

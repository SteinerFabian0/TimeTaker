#
# TimeTaker BLE bridge, stage A (BLE_FIRMWARE_GUIDE.md §9).
#
# Grown from nrf/samples/bluetooth/peripheral_uart/prj_minimal.conf (NCS
# v3.4.2), with every "frees RAM" change of §9 applied:
#   - no SMP / bonding / settings / NVS / flash (security: §6.4)
#   - no DK library, no sample write thread
#   - heap trimmed
# Stage B (MTU 247, DLE, 2M PHY) lives in stage_b_*.conf fragments; see §14
# for which ones the release build uses and the RAM/flash of each.
#

# --- STM link: UARTE0 async (DMA), 460800 8N1, no console --------------------
CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_STDOUT_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_EARLY_CONSOLE=n

# --- Our peripherals ------------------------------------------------------------
CONFIG_GPIO=y
CONFIG_WATCHDOG=y
CONFIG_I2C=n
CONFIG_SPI=n

# Event loop: k_poll on one semaphore.
CONFIG_POLL=y

# --- Memory -----------------------------------------------------------------------
# No dynamic allocation in our code; the BT host on this config needs no heap.
CONFIG_HEAP_MEM_POOL_SIZE=0
CONFIG_COMMON_LIBC_MALLOC=n

# Threads (guide §8.1). Stack sizes from prj_minimal.conf; the main loop is
# ours. Re-measure with debug.conf + the thread analyzer at bring-up.
CONFIG_MAIN_STACK_SIZE=1024
CONFIG_BT_RX_STACK_SIZE=1024
CONFIG_BT_HCI_TX_STACK_SIZE_WITH_PROMPT=y
CONFIG_BT_HCI_TX_STACK_SIZE=640
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024
CONFIG_MPSL_WORK_STACK_SIZE=256
CONFIG_IDLE_STACK_SIZE=128
CONFIG_ISR_STACK_SIZE=1024

# --- Bluetooth: one connection, peripheral, NUS, no security ------------------------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="TimeTaker"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_NUS=y

# Connection parameters requested 5 s after connect (guide §6.3):
# 7.5-30 ms, latency 0, supervision timeout 4 s. The central decides.
CONFIG_BT_GAP_PERIPHERAL_PREF_PARAMS=y
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# --- Interrupts, memory protection, boot --------------------------------------------
CONFIG_DYNAMIC_INTERRUPTS=n
CONFIG_IRQ_OFFLOAD=n
CONFIG_THREAD_STACK_INFO=n
CONFIG_THREAD_CUSTOM_DATA=n
CONFIG_FPU=n
CONFIG_ARM_MPU=n
CONFIG_NCS_BOOT_BANNER=n
CONFIG_BOOT_BANNER=n
CONFIG_BOOT_DELAY=0
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_TIMESLICING=n

# --- No logging, no asserts in the release image (guide §10) -------------------------
# A fatal error reboots at once (NCS handler) instead of waiting for the WDT.
CONFIG_RESET_ON_FATAL_ERROR=y
CONFIG_LOG=n
CONFIG_ASSERT=n
CONFIG_BT_DEBUG_NONE=y
CONFIG_BT_ASSERT=n

# --- Bluetooth features not needed ---------------------------------------------------
CONFIG_BT_DATA_LEN_UPDATE=n
CONFIG_BT_PHY_UPDATE=n
CONFIG_BT_GATT_CACHING=n
CONFIG_BT_GATT_SERVICE_CHANGED=n
CONFIG_BT_HCI_VS=n
CONFIG_BT_CTLR_PRIVACY=n
CONFIG_BT_CTLR_PHY_2M=n

# --- Bluetooth buffers (prj_minimal.conf values) ------------------------------------
CONFIG_BT_BUF_EVT_DISCARDABLE_COUNT=1
CONFIG_BT_BUF_EVT_DISCARDABLE_SIZE=43
CONFIG_BT_BUF_EVT_RX_COUNT=4
CONFIG_BT_CONN_TX_MAX=3
CONFIG_BT_L2CAP_TX_BUF_COUNT=2
CONFIG_BT_ATT_TX_COUNT=2
CONFIG_BT_BUF_ACL_TX_COUNT=3
CONFIG_BT_BUF_ACL_TX_SIZE=27

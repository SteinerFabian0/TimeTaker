# ST-LINK V3 + nRF52 target, for `west flash/debug --runner openocd` and for
# OpenOCD by hand (BENCH_TESTS.md T1).
#
# xPack OpenOCD 0.12.0-7 deprecates interface/stlink-dap.cfg and
# "transport select dapdirect_swd" (the forms in the guide §4.3) in favour of
# these two lines, which select the same direct DAP mode. The DAP mode
# (not HLA) is what lets nrf52_recover reach the CTRL-AP.
source [find interface/stlink.cfg]
transport select swd
source [find target/nordic/nrf52.cfg]

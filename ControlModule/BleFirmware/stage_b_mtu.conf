# Stage B1: ATT MTU 247 (BLE_FIRMWARE_GUIDE.md §6.3, §9).
# Notifications of up to 244 B (one STM DATA frame per notification) and
# browser writes up to 244 B. The host fragments to the link-layer size.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
# The ATT MTU exchange is the central's (Chrome, Android, nRF Connect do it);
# the peripheral has no GATT client to start it.

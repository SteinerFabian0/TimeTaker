# ---------------------------------------------------------------------------
# Reusable structs
# ---------------------------------------------------------------------------

[[struct]]
name = "nodeInfo"
doc = "One addressable node, as listed by NODE_LIST"
fields = [
  { name = "nodeClass", type = "u8", enum = "nodeClass" },
  { name = "index", type = "u8", doc = "0 for singletons, 1..6 for lanes" },
  { name = "boardType", type = "u8", enum = "boardType" },
  { name = "state", type = "u8", enum = "nodeState" },
  { name = "fwMajor", type = "u8" },
  { name = "fwMinor", type = "u8" },
  { name = "fwPatch", type = "u8" },
  { name = "protoMinor", type = "u8", doc = "Lane bus / link protocol minor version of that node" },
  { name = "fwGitRev", type = "u32", doc = "Short git revision the image was built from" },
  { name = "imageCrc", type = "u32", doc = "CRC32 of the running image (0 = unknown)" },
]

[[struct]]
name = "laneConfig"
doc = "Detection and sampling config of one lane (lane_protocol.h laneConfig_t, same layout)"
fields = [
  { name = "samplePeriodUs", type = "u32", doc = "Sampling period, e.g. 1000 (1 kHz)" },
  { name = "samplePhaseUs", type = "u32", doc = "Offset inside the period (staggers the IR pulses)" },
  { name = "mergeGapUs", type = "u32", doc = "Re-entry within this counts as the same car" },
  { name = "blockTimeoutUs", type = "u32", doc = "Below LOW longer than this: BLOCKED" },
  { name = "holdoffUs", type = "u32", doc = "Holdoff after an event, 0 = off" },
  { name = "holdoffSamplePeriodUs", type = "u32", doc = "Sampling period inside the holdoff, 0 = unchanged" },
  { name = "thrDropPermille", type = "u16", doc = "LOW = baseline x (1000 - x) / 1000" },
  { name = "hystPermille", type = "u16", doc = "HIGH = LOW + baseline x x / 1000" },
  { name = "minDwell10us", type = "u16", doc = "Shorter dips are glitches" },
  { name = "rawDecimation", type = "u16", doc = "RAW mode keeps every Nth sample (>= 1)" },
  { name = "irCurrent", type = "u8", doc = "VCNL4040 LED_I code" },
  { name = "psIntegration", type = "u8", doc = "VCNL4040 PS_IT code" },
  { name = "psMultiPulse", type = "u8", doc = "VCNL4040 PS_MPS code" },
  { name = "reserved", type = "u8" },
]

[[struct]]
name = "bindEntry"
doc = "One bound BLE client"
fields = [
  { name = "clientId", type = "u8[16]" },
  { name = "clientName", type = "str[24]" },
  { name = "lastUsed", type = "u32", doc = "LRU stamp: higher = used more recently" },
]

[[struct]]
name = "deviceSettings"
doc = "Persistent device settings (settings_store)"
fields = [
  { name = "deviceName", type = "str[24]", doc = "Shown in the app" },
  { name = "bleEnabled", type = "u8", doc = "0 = the nRF stops advertising" },
  { name = "reserved", type = "u8[3]" },
]

# ---------------------------------------------------------------------------
# Session (0x00 - 0x0F)
# ---------------------------------------------------------------------------

[[message]]
id = 0x01
name = "HELLO"
kind = "request"
doc = "Opens a session. Must be the first request on every transport connection."
request = [
  { name = "protoMajor", type = "u8" },
  { name = "protoMinor", type = "u8" },
  { name = "clientKind", type = "u8", enum = "clientKind" },
  { name = "reserved", type = "u8" },
  { name = "clientId", type = "u8[16]", doc = "Random per browser profile, kept in localStorage; the BLE bind key" },
  { name = "clientName", type = "str[24]", doc = "Shown in the bind list" },
]
response = [
  { name = "protoMajor", type = "u8" },
  { name = "protoMinor", type = "u8" },
  { name = "transport", type = "u8", enum = "transport", doc = "Which transport this session runs on" },
  { name = "bindState", type = "u8", enum = "bindState" },
  { name = "bootId", type = "u32", doc = "Random per control module boot; keys the event sequence" },
  { name = "sysUs", type = "u64", doc = "System time when the response was built" },
  { name = "logOldestSeq", type = "u32", doc = "Oldest evSeq still in the event log" },
  { name = "logNextSeq", type = "u32", doc = "evSeq the next event will get" },
  { name = "otherSessions", type = "u8", doc = "Number of other live sessions (USB + BLE at once)" },
  { name = "boardType", type = "u8", enum = "boardType", doc = "What answers: CONTROL (the app) or CONTROL_BOOT (the bootloader). Since 0.3; 0 from older firmware" },
  { name = "reserved", type = "u8[2]" },
]
example_request = { protoMajor = 0, protoMinor = 1, clientKind = 1, reserved = 0, clientId = "00112233445566778899aabbccddeeff", clientName = "Laptop Großonkel" }
example_response = { protoMajor = 0, protoMinor = 3, transport = 2, bindState = 1, bootId = 0x5eed1234, sysUs = 1234567890123, logOldestSeq = 0, logNextSeq = 42, otherSessions = 1, boardType = 1, reserved = "0000" }

[[message]]
id = 0x02
name = "PING"
kind = "request"
doc = "Heartbeat (host sends every 1 s) and clock estimate: the host maps sysUs to its own clock from the round trip."
request = [
  { name = "hostMs", type = "u32", doc = "Echoed back unchanged" },
]
response = [
  { name = "hostMs", type = "u32" },
  { name = "sysUs", type = "u64" },
]
example_request = { hostMs = 987654 }
example_response = { hostMs = 987654, sysUs = 9223372036854775807 }  # > 2^53: TS must use bigint

[[message]]
id = 0x03
name = "RESUME"
kind = "request"
doc = "Moves this session's event cursor back to fromSeq; the device replays from there. ERR_BOOT_MISMATCH or ERR_LOG_GAP (status-only) when it cannot."
request = [
  { name = "bootId", type = "u32" },
  { name = "fromSeq", type = "u32" },
]
response = [
  { name = "logOldestSeq", type = "u32" },
  { name = "logNextSeq", type = "u32" },
]
example_request = { bootId = 0x5eed1234, fromSeq = 17 }
example_response = { status = -16 }

[[message]]
id = 0x04
name = "NODE_LIST"
kind = "request"
doc = "Every node the control module knows, with versions. The web app builds its UI from this."
request = []
response = [
  { name = "nodes", type = "nodeInfo[]" },
]
example_request = {}

[[message.example_response.nodes]]
nodeClass = 0
index = 0
boardType = 1
state = 1
fwMajor = 0
fwMinor = 1
fwPatch = 0
protoMinor = 1
fwGitRev = 0x0abc123
imageCrc = 0xdeadbeef

[[message.example_response.nodes]]
nodeClass = 1
index = 3
boardType = 2
state = 2
fwMajor = 1
fwMinor = 2
fwPatch = 3
protoMinor = 0
fwGitRev = 0x1234567
imageCrc = 0

[[message]]
id = 0x05
name = "BIND_LIST"
kind = "request"
doc = "The BLE bind list, paged (8 entries do not fit one frame). TRUSTED or BOUND sessions only."
request = [
  { name = "start", type = "u8", doc = "Index of the first entry wanted" },
]
response = [
  { name = "total", type = "u8", doc = "Entries on the list" },
  { name = "start", type = "u8" },
  { name = "windowS", type = "u16", doc = "Seconds left in the pairing window, 0 = closed" },
  { name = "entries", type = "bindEntry[]", doc = "Up to 5 per page" },
]
example_request = { start = 0 }

[[message.example_response.entries]]
clientId = "00112233445566778899aabbccddeeff"
clientName = "Laptop"
lastUsed = 7

[message.example_response]
total = 1
start = 0
windowS = 42

[[message]]
id = 0x06
name = "BIND_REMOVE"
kind = "request"
doc = "Removes one client from the bind list; an all-zero clientId clears the list. TRUSTED or BOUND sessions only."
request = [
  { name = "clientId", type = "u8[16]" },
]
response = []
example_request = { clientId = "00000000000000000000000000000000" }
example_response = { status = -15 }

[[message]]
id = 0x08
name = "BIND_ALLOW"
kind = "request"
doc = "Opens the BLE pairing window from the app. Accepted from TRUSTED (USB) and BOUND sessions only."
request = [
  { name = "windowS", type = "u16", doc = "Window length in seconds, 0 closes it" },
]
response = []
example_request = { windowS = 60 }
example_response = {}

# ---------------------------------------------------------------------------
# System (0x10 - 0x1F)
# ---------------------------------------------------------------------------

[[message]]
id = 0x11
name = "REBOOT"
kind = "request"
doc = "Reboots the control module, into the app or into its bootloader. The response goes out before the reset."
request = [
  { name = "target", type = "u8", enum = "rebootTarget" },
]
response = []
example_request = { target = 1 }
example_response = {}

[[message]]
id = 0x12
name = "STATUS"
kind = "request"
doc = "Control module health: errors, loop time, lanes, links, event log window."
request = []
response = [
  { name = "lastError", type = "i16", doc = "ctrlStatus_e of the last error, 0 = none" },
  { name = "loopMaxMs", type = "u16", doc = "Longest super-loop pass since boot" },
  { name = "errorCount", type = "u32" },
  { name = "uptimeMs", type = "u32" },
  { name = "lanesPresent", type = "u8", doc = "Lanes enumerated (contiguous from 1)" },
  { name = "lanesPowered", type = "u8", doc = "1 = lane rail settled and SYNC running" },
  { name = "bleLink", type = "u8", enum = "bleLinkState" },
  { name = "seqRunning", type = "u8", doc = "1 = a start sequence is running" },
  { name = "usbFaults", type = "u16", doc = "USB_FAULT trips since boot" },
  { name = "settingsWrites", type = "u16", doc = "Flash writes since boot" },
  { name = "logOldestSeq", type = "u32" },
  { name = "logNextSeq", type = "u32" },
]
example_request = {}

[[message]]
id = 0x13
name = "SETTINGS_GET"
kind = "request"
example_request = {}
example_response = { settings = { deviceName = "TimeTaker", bleEnabled = 1, reserved = "000000" } }
doc = "Reads the persistent device settings."
request = []
response = [
  { name = "settings", type = "deviceSettings" },
]

[[message]]
id = 0x14
name = "SETTINGS_SET"
kind = "request"
doc = "Writes the device settings. Stored to flash when no start sequence runs (deferred, at most every 10 s)."
request = [
  { name = "settings", type = "deviceSettings" },
]
response = []
example_request = { settings = { deviceName = "TimeTaker Opa", bleEnabled = 1, reserved = "000000" } }
example_response = {}

# ---------------------------------------------------------------------------
# Lanes (0x20 - 0x3F)
# ---------------------------------------------------------------------------

[[message]]
id = 0x20
name = "LANE_SCAN"
kind = "request"
example_request = {}
example_response = {}
doc = "Re-runs the lane chain enumeration: every lane LEFT, then JOINED/CONFIGURED in chain order. Needs lane power."
request = []
response = []

[[message]]
id = 0x21
name = "LANE_POWER"
kind = "request"
doc = "Switches the lane rail (LANE_3V3). On: rail first, SYNC and bus lines once it has settled. Off: signals parked first, then the rail. Answers once the switch is under way; the lane events report the rest."
request = [
  { name = "on", type = "u8", doc = "1 = power the lanes, 0 = off" },
]
response = [
  { name = "powered", type = "u8", doc = "Rail state when the response was built (on settles in about 30 ms)" },
]
example_request = { on = 1 }
example_response = { powered = 0 }

[[message]]
id = 0x22
name = "LANE_CONFIG_GET"
kind = "request"
example_request = { lane = 2 }
doc = "The control module's config table entry for one lane (pushed to the lane at every join)."
request = [
  { name = "lane", type = "u8", doc = "1..6" },
]
response = [
  { name = "lane", type = "u8" },
  { name = "reserved", type = "u8[3]" },
  { name = "config", type = "laneConfig" },
]

[[message]]
id = 0x23
name = "LANE_CONFIG_SET"
kind = "request"
doc = "Writes the config table for the lanes in laneMask and pushes it to those present. save = 1 also persists the table."
request = [
  { name = "laneMask", type = "u8", doc = "Bit n-1 = lane n" },
  { name = "save", type = "u8" },
  { name = "reserved", type = "u16" },
  { name = "config", type = "laneConfig" },
]
response = []
example_request = { laneMask = 0x3f, save = 1, reserved = 0, config = { samplePeriodUs = 1000, samplePhaseUs = 0, mergeGapUs = 30000, blockTimeoutUs = 500000, holdoffUs = 0, holdoffSamplePeriodUs = 0, thrDropPermille = 300, hystPermille = 100, minDwell10us = 200, rawDecimation = 1, irCurrent = 7, psIntegration = 3, psMultiPulse = 0, reserved = 0 } }
example_response = {}

[[message]]
id = 0x24
name = "LANE_SAMPLING"
kind = "request"
example_request = { laneMask = 0x3f, mode = 1 }
example_response = {}
doc = "Sets the sampling mode of the lanes in laneMask (kept in the config table, restored after a re-join)."
request = [
  { name = "laneMask", type = "u8" },
  { name = "mode", type = "u8", enum = "samplingMode" },
]
response = []

[[message]]
id = 0x25
name = "LANE_LED"
kind = "request"
doc = "Sets the start light of the lanes in laneMask at once. Refused while a start sequence runs (ERR_SEQ_RUNNING)."
request = [
  { name = "laneMask", type = "u8" },
  { name = "mode", type = "u8", enum = "ledMode" },
  { name = "level", type = "u16", doc = "0..1000 perceived brightness" },
  { name = "blinkPeriodMs", type = "u16" },
  { name = "blinkOnPermille", type = "u16" },
  { name = "blinkCount", type = "u16", doc = "0 = until changed" },
]
response = []
example_request = { laneMask = 0x05, mode = 2, level = 1000, blinkPeriodMs = 500, blinkOnPermille = 500, blinkCount = 3 }
example_response = {}

[[message]]
id = 0x26
name = "LANE_STATUS"
kind = "request"
doc = "One lane's STATUS and SIGNAL registers, read fresh over the bus."
request = [
  { name = "lane", type = "u8" },
]
response = [
  { name = "lane", type = "u8" },
  { name = "state", type = "u8", enum = "laneBusState" },
  { name = "samplingMode", type = "u8", enum = "samplingMode" },
  { name = "fifoCount", type = "u8" },
  { name = "flags", type = "u16", doc = "lane_protocol.h LANE_STATUS_* bits" },
  { name = "droppedEvents", type = "u16" },
  { name = "syncShifts", type = "u16" },
  { name = "badWrites", type = "u16" },
  { name = "lateActions", type = "u16" },
  { name = "lastError", type = "i16", doc = "The lane's own status code" },
  { name = "resetCause", type = "u8", enum = "resetCause" },
  { name = "faultId", type = "u8" },
  { name = "uptimeMs", type = "u32" },
  { name = "raw", type = "u16" },
  { name = "baseline", type = "u16" },
  { name = "thrLow", type = "u16" },
  { name = "thrHigh", type = "u16" },
  { name = "noise", type = "u16" },
  { name = "reserved", type = "u16" },
]
example_request = { lane = 4 }
example_response = { status = -21 }

[[message]]
id = 0x27
name = "LANE_RAW_STREAM"
kind = "request"
example_request = { lane = 3, reserved = 0, decimation = 4 }
doc = "Streams one lane's raw samples as STR_RAW_SAMPLES (puts it in RAW mode; lane 0 stops and restores the previous mode). One lane at a time."
request = [
  { name = "lane", type = "u8", doc = "1..6, 0 = stop" },
  { name = "reserved", type = "u8" },
  { name = "decimation", type = "u16", doc = "Keep every Nth sample (>= 1)" },
]
response = []

[[message]]
id = 0x28
name = "LANE_CALIBRATE"
kind = "request"
example_request = { laneMask = 0x01 }
example_response = { status = -21 }
doc = "The lanes in laneMask re-learn their baseline. Only meaningful with the lane free."
request = [
  { name = "laneMask", type = "u8" },
]
response = []

# ---------------------------------------------------------------------------
# Sequences (0x40 - 0x4F)
# ---------------------------------------------------------------------------

[[message]]
id = 0x40
name = "START_SEQUENCE"
kind = "request"
doc = "F1-style start: lane k lights at T0 + k*step, all go out together at Tout = T0 + n*step + random hold. EVT_SEQ_STARTED now, EVT_LIGHTS_OUT at Tout (never earlier)."
request = [
  { name = "lights", type = "u8", doc = "1..6; lanes present are lit in index order" },
  { name = "armSampling", type = "u8", doc = "1 = also switch sampling ON at T0" },
  { name = "stepMs", type = "u16" },
  { name = "holdMinMs", type = "u16" },
  { name = "holdMaxMs", type = "u16" },
  { name = "leadMs", type = "u16", doc = "Time from now to T0; 0 = default (>= 150 ms)" },
  { name = "reserved", type = "u16" },
]
response = [
  { name = "reserved", type = "u16" },
  { name = "t0Us", type = "u64", doc = "System time the first light goes on" },
]
example_request = { lights = 6, armSampling = 1, stepMs = 1000, holdMinMs = 200, holdMaxMs = 3000, leadMs = 0, reserved = 0 }
example_response = { reserved = 0, t0Us = 60000000 }

[[message]]
id = 0x41
name = "ABORT_SEQUENCE"
kind = "request"
example_request = {}
example_response = { status = -3 }
doc = "Cancels the running start sequence: lanes' pending actions cancelled, lights blink, EVT_SEQ_ABORTED."
request = []
response = []

# ---------------------------------------------------------------------------
# Update (0xA0 - 0xAF). Served by the control module's bootloader
# (boardType CONTROL_BOOT); the app answers them ERR_INVALID_STATE and the
# host uses REBOOT{BOOTLOADER} first.
# ---------------------------------------------------------------------------

[[message]]
id = 0xA0
name = "UPDATE_BEGIN"
kind = "request"
doc = "Starts an update: erases the app region. The image must be for this board type."
request = [
  { name = "boardType", type = "u8", enum = "boardType" },
  { name = "reserved", type = "u8[3]" },
  { name = "size", type = "u32", doc = "Image bytes" },
  { name = "crc32", type = "u32", doc = "CRC-32 (IEEE) of the whole image" },
]
response = [
  { name = "chunkMax", type = "u16", doc = "Largest data tail UPDATE_CHUNK accepts" },
  { name = "reserved", type = "u16" },
]
example_request = { boardType = 1, reserved = "000000", size = 131072, crc32 = 0x1234abcd }
example_response = { chunkMax = 224, reserved = 0 }

[[message]]
id = 0xA1
name = "UPDATE_CHUNK"
kind = "request"
doc = "Writes data at offset. Offsets must be contiguous; a repeated chunk (same offset as the last) is acknowledged again, so retries are safe. Resume rule: re-sent bytes (offset below nextOffset) that match what is already written are acknowledged without rewriting, and the response always carries the real nextOffset, so a host that restarts from an earlier offset is fast-forwarded to where the bootloader stands."
request = [
  { name = "offset", type = "u32" },
  { name = "data", type = "u8[]" },
]
response = [
  { name = "nextOffset", type = "u32" },
]
example_request = { offset = 224, data = "00ff10" }
example_response = { nextOffset = 227 }

[[message]]
id = 0xA2
name = "UPDATE_END"
kind = "request"
example_request = {}
example_response = { status = -51 }
doc = "Verifies the CRC over the written image and writes the image header last. ERR_IMAGE_CRC if it does not match."
request = []
response = []

[[message]]
id = 0xA3
name = "UPDATE_ABORT"
kind = "request"
example_request = {}
doc = "Abandons the update. The bootloader stays (no valid app)."
request = []
response = []

[[message]]
id = 0xA4
name = "BOOT_APP"
kind = "request"
example_request = {}
example_response = {}
doc = "Leaves the bootloader and starts the app, if its header and CRC are valid. The response goes out first."
request = []
response = []

# ---------------------------------------------------------------------------
# Events (0xC0 - 0xDF). evSeq u32 is injected as the first field.
# ---------------------------------------------------------------------------

[[message]]
id = 0xC0
name = "EVT_BOOT"
kind = "event"
doc = "Always evSeq 0 of a boot: marks the start of a log."
fields = [
  { name = "resetCause", type = "u8", enum = "resetCause" },
  { name = "reserved", type = "u8[3]" },
  { name = "bootId", type = "u32" },
  { name = "sysUs", type = "u64" },
]
example = { evSeq = 0, resetCause = 1, reserved = "000000", bootId = 0x5eed1234, sysUs = 1500 }

[[message]]
id = 0xC1
name = "EVT_CROSSING"
kind = "event"
doc = "A lane event: car crossing, block, clear or sensor fault. tEntryUs is the timing reference (car nose on the line)."
fields = [
  { name = "lane", type = "u8", doc = "1..6" },
  { name = "type", type = "u8", enum = "laneEventType" },
  { name = "flags", type = "u8", enum = "laneEventFlag" },
  { name = "reserved", type = "u8" },
  { name = "tEntryUs", type = "u64", doc = "System time of the interpolated entry" },
  { name = "laneSeq", type = "u16", doc = "The lane's own event counter (gaps = lost on the lane)" },
  { name = "dwell10us", type = "u16", doc = "Entry to exit, in units of 10 µs" },
  { name = "depth", type = "u16", doc = "Signal minimum relative to baseline: confidence" },
  { name = "reserved2", type = "u16" },
]
example = { evSeq = 4242, lane = 3, type = 1, flags = 0x18, reserved = 0, tEntryUs = 81234567, laneSeq = 65535, dwell10us = 2150, depth = 812, reserved2 = 0 }

[[message]]
id = 0xC2
name = "EVT_LANE_STATE"
kind = "event"
doc = "A lane joined, was configured, left, faulted, or lost/regained SYNC."
fields = [
  { name = "lane", type = "u8" },
  { name = "state", type = "u8", enum = "laneState" },
  { name = "status", type = "i16", doc = "ctrlStatus_e reason (0 if none)" },
  { name = "sysUs", type = "u64" },
]
example = { evSeq = 5, lane = 6, state = 4, status = -22, sysUs = 9000000 }

[[message]]
id = 0xC3
name = "EVT_BUTTON"
kind = "event"
doc = "A button on the control module (or the BLE bind button) was pressed. The host decides what it means."
fields = [
  { name = "button", type = "u8", enum = "buttonId" },
  { name = "press", type = "u8", enum = "pressKind" },
  { name = "reserved", type = "u16" },
  { name = "sysUs", type = "u64" },
]
example = { evSeq = 77, button = 2, press = 2, reserved = 0, sysUs = 4000000000 }

[[message]]
id = 0xC4
name = "EVT_SEQ_STARTED"
kind = "event"
doc = "A start sequence was planned and written to the lanes. Tout is deliberately not in it."
fields = [
  { name = "lights", type = "u8" },
  { name = "armSampling", type = "u8" },
  { name = "stepMs", type = "u16" },
  { name = "t0Us", type = "u64" },
]
example = { evSeq = 100, lights = 6, armSampling = 1, stepMs = 1000, t0Us = 60000000 }

[[message]]
id = 0xC5
name = "EVT_LIGHTS_OUT"
kind = "event"
doc = "All lights went out at toutUs: the race start. False starts and reaction times are judged against it."
fields = [
  { name = "lights", type = "u8" },
  { name = "reserved", type = "u8[3]" },
  { name = "toutUs", type = "u64" },
]
example = { evSeq = 101, lights = 6, reserved = "000000", toutUs = 67123456 }

[[message]]
id = 0xC6
name = "EVT_SEQ_ABORTED"
kind = "event"
example = { evSeq = 102, reason = 2, reserved = "000000", atUs = 64000000 }
doc = "The start sequence was cancelled."
fields = [
  { name = "reason", type = "u8", enum = "seqAbortReason" },
  { name = "reserved", type = "u8[3]" },
  { name = "atUs", type = "u64" },
]

[[message]]
id = 0xC7
name = "EVT_BIND_CHANGED"
kind = "event"
example = { evSeq = 7, change = 1, count = 3, windowS = 51, clientIdPrefix = "0011223344556677" }
doc = "The BLE bind list or pairing window changed."
fields = [
  { name = "change", type = "u8", enum = "bindChange" },
  { name = "count", type = "u8", doc = "Entries on the list after the change" },
  { name = "windowS", type = "u16", doc = "Pairing window seconds left" },
  { name = "clientIdPrefix", type = "u8[8]", doc = "First 8 bytes of the client concerned (zero if none)" },
]

[[message]]
id = 0xC8
name = "EVT_BLE_LINK"
kind = "event"
example = { evSeq = 8, state = 1, phy = 2, attMtu = 247, intervalUnits = 24, reason = 0, reserved = 0, sysUs = 12000000 }
doc = "The BLE link to a central came up, changed parameters, or went down."
fields = [
  { name = "state", type = "u8", enum = "bleLinkState" },
  { name = "phy", type = "u8", doc = "1 = 1M, 2 = 2M" },
  { name = "attMtu", type = "u16" },
  { name = "intervalUnits", type = "u16", doc = "1.25 ms units" },
  { name = "reason", type = "u8", doc = "HCI reason on DOWN" },
  { name = "reserved", type = "u8" },
  { name = "sysUs", type = "u64" },
]

[[message]]
id = 0xC9
name = "EVT_FAULT"
kind = "event"
example = { evSeq = 9, source = 4, reserved = 0, status = -41, sysUs = 1200000 }
doc = "A hardware fault input tripped, or (source SETTINGS, status ERR_SETTINGS_CORRUPT) the stored settings were lost: published once at boot when the settings store fell back to defaults."
fields = [
  { name = "source", type = "u8", enum = "faultSource" },
  { name = "reserved", type = "u8" },
  { name = "status", type = "i16" },
  { name = "sysUs", type = "u64" },
]

# ---------------------------------------------------------------------------
# Streams (0xE0 - 0xEF) and debug streams (0xF0 - 0xFF)
# ---------------------------------------------------------------------------

[[message]]
id = 0xE0
name = "STR_RAW_SAMPLES"
kind = "stream"
doc = "Decimated raw sensor samples of one lane for the diagnostics view. Sample i was taken at firstUs + i*periodUs."
fields = [
  { name = "lane", type = "u8" },
  { name = "reserved", type = "u8" },
  { name = "chunkSeq", type = "u16", doc = "Counts chunks of this lane's stream, so the app sees drops" },
  { name = "periodUs", type = "u32" },
  { name = "firstUs", type = "u64" },
  { name = "samples", type = "u16[]" },
]
example = { lane = 1, reserved = 0, chunkSeq = 9, periodUs = 1000, firstUs = 5000000, samples = [4000, 3990, 1200, 0, 65535] }

[[message]]
id = 0xF0
name = "DBG_LOG"
kind = "stream"
doc = "Free-text firmware log line (bring-up aid; mnemonics stay stable like the hub's log vocabulary)."
fields = [
  { name = "level", type = "u8", enum = "logLevel" },
  { name = "reserved", type = "u8[3]" },
  { name = "sysUs", type = "u64" },
  { name = "text", type = "str[]" },
]
example = { level = 3, reserved = "000000", sysUs = 123, text = "LANE 3 JOIN addr=0x0B µs-ok" }

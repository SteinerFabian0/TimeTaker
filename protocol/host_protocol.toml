  { name = "EXTRAPOLATED", value = 0x04, doc = "SYNC lost: mapped with the last period" },
  { name = "IN_HOLDOFF", value = 0x08, doc = "Inside the holdoff window after the previous event" },
  { name = "MERGED", value = 0x10, doc = "Two dips within the merge gap counted as one car" },
  { name = "SATURATED", value = 0x20, doc = "Sensor saturated during the pass" },
]

[[enum]]
name = "laneState"
prefix = "LANE_STATE"
values = [
  { name = "JOINED", value = 1, doc = "Enumerated on the bus" },
  { name = "CONFIGURED", value = 2, doc = "Config pushed and SYNC aligned" },
  { name = "LEFT", value = 3, doc = "Dropped off the bus (chain broken, reset)" },
  { name = "FAULT", value = 4, doc = "Reports a fault; status field says which" },
  { name = "SYNC_LOST", value = 5 },
  { name = "SYNC_OK", value = 6 },
]

[[enum]]
name = "buttonId"
prefix = "BUTTON"
values = [
  { name = "BTN1", value = 1 },
  { name = "BTN2", value = 2 },
  { name = "BTN3", value = 3 },
  { name = "BLE_BIND", value = 4, doc = "SW501, reported by the nRF" },
